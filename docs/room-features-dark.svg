<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Boardroom features: included items in bold, items not in this room in gray">
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:15px}.c{font-size:13px;font-weight:700;letter-spacing:.4px}.a{font-weight:700}.t{font-size:17px;font-weight:700}.l{stroke:#30363D}.c{fill:#9198A1}.a,.t{fill:#F0F6FC}.n{fill:#7D8590}</style>
<text class="t" x="24" y="36">Boardroom</text>
<text x="936" y="36" text-anchor="end" font-size="13"><tspan class="a">Bold</tspan><tspan class="n"> in this room</tspan><tspan class="n" dx="16">Gray</tspan><tspan class="n"> not in this room</tspan></text>
<line x1="24" x2="936" y1="62" y2="62" class="l"/>
<text class="c" x="24" y="86">ROOM</text>
<text x="160" y="86"><tspan class="a">Single room</tspan><tspan class="a" dx="26">Auto shutdown</tspan><tspan class="n" dx="26">Divisible</tspan><tspan class="n" dx="26">Lighting and shades</tspan><tspan class="n" dx="26">Scheduling</tspan></text>
